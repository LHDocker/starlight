name: mirror-build-server

# Builds the Space Station 14 fork "ss14Starlight/space-station-14" server from
# source and publishes SS14.Server_linux-x64.zip as a GitHub Release.
# Drop this into a fork of ss14Starlight/space-station-14 at
# .github/workflows/mirror-build-server.yml
#
# Adapted from the LHDocker triad mirror. Starlight specifics:
#   - upstream repo  = ss14Starlight/space-station-14
#   - BRANCH         = starlight-dev  (NOT master and NOT main — vanilla/Goob/
#                      sunrise use master, Triad uses main, this one uses
#                      starlight-dev. Every branch reference below is that.)
#   - .NET           = 10  (global.json on starlight-dev pins sdk 10.0.100 as of
#                           2026-09-24; always match the repo's global.json)
#   => the RUNTIME Docker image for these builds must be dotnet_10 to match.
#   - engine         = space-wizards/RobustToolbox submodule; we run the SS14
#                      submodule-dependency action to align it.
#   - solution       = SpaceStation14.slnx (slnx format, no .sln at root), same
#                      as Triad. `dotnet restore` at repo root handles this fine.
#
# Note: Starlight DOES publish its own builds to cdn.starlight.network, but the
# egg installs forks from GitHub releases, and the direct-link DOWNLOAD_URL var
# is admin-only. Mirroring here makes Starlight selectable by customers with
# GITHUB_REPO=LHDocker/starlight.

on:
  schedule:
    - cron: '0 8 * * *'   # nightly 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror-build-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout upstream starlight-dev (+ engine submodules)
        uses: actions/checkout@v4
        with:
          repository: ss14Starlight/space-station-14
          ref: starlight-dev
          submodules: recursive
          fetch-depth: 1

      - name: Resolve upstream version
        id: ver
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=server-$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip if this commit was already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists - skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Match the upstream global.json. Starlight = .NET 10 as of 2026-09-24.
      # If a future exit-150 ".NET version" error appears, re-check global.json and bump this.
      - name: Setup .NET 10
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Aligns the RobustToolbox submodule, matching upstream CI behaviour.
      - name: Align engine submodule (SS14 dependency action)
        if: steps.check.outputs.exists == 'false'
        uses: space-wizards/submodule-dependency@v0.1.5

      # --hybrid-acz is NOT optional for a self-hosted server.
      # Without it the server package contains no Content.Client.zip, so the
      # first time a launcher or the SS14 hub hits GET /info the server falls
      # back to "Magic ACZ" and tries to package the client FROM SOURCE:
      #   [DEBG] statushost.acz: Using Magic ACZ
      #   [FATL] unhandled: DirectoryNotFoundException '/bin/Content.Client/Content.Shared.dll'
      #   Aborted (core dumped) ./Robust.Server
      # A release package has no source tree, so it aborts the process — the
      # exception is thrown on a threadpool thread, so it kills the server,
      # not just the request. Symptom is a crash-loop every couple of minutes
      # (the hub polls) that looks like "crashes when a player connects".
      - name: Build & package server (linux-x64, hybrid ACZ)
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          dotnet restore
          dotnet build Content.Packaging --configuration Release --no-restore /m
          dotnet run --project Content.Packaging server --hybrid-acz --platform linux-x64

      - name: List build output
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "--- release/ ---"; ls -la release/ 2>/dev/null || true

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # server packaging emits release/SS14.Server_linux-x64.zip
          f=$(ls release/SS14.Server_linux-x64.zip 2>/dev/null || ls release/*.zip | head -1)
          echo "Artifact: $f"
          gh release create "${{ steps.ver.outputs.tag }}" \
            -R "${{ github.repository }}" \
            -t "Starlight SS14 server ${{ steps.ver.outputs.tag }}" \
            -n "Automated server build of upstream ss14Starlight/space-station-14@${{ steps.ver.outputs.sha }} ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --latest \
            "$f"

      - name: Mirror fork starlight-dev = upstream starlight-dev + this workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Locate THIS workflow file by its own path rather than hardcoding the
          # name — the file may legitimately be saved under a different filename,
          # and a hardcoded `mirror-build-server.yml` makes this step fail with
          # "No such file" under `set -e`. GITHUB_WORKFLOW_REF looks like:
          #   owner/repo/.github/workflows/<file>.yml@refs/heads/starlight-dev
          WF_REL="${GITHUB_WORKFLOW_REF%%@*}"      # strip @ref
          WF_REL="${WF_REL#*/}"; WF_REL="${WF_REL#*/}"   # strip owner/repo/
          echo "this workflow lives at: $WF_REL"

          tmp=$(mktemp -d)
          git clone --depth=1 --branch starlight-dev "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$tmp/m"
          cd "$tmp/m"
          cp "$WF_REL" "$tmp/wf.yml"
          git config user.name "lhdocker-ci"
          git config user.email "ci@legionhosting.net"
          git remote add upstream https://github.com/ss14Starlight/space-station-14.git
          git fetch --depth=1 upstream starlight-dev
          git checkout -B starlight-dev upstream/starlight-dev
          mkdir -p "$(dirname "$WF_REL")"
          cp "$tmp/wf.yml" "$WF_REL"
          git add "$WF_REL"
          git commit -m "mirror: upstream starlight-dev + ci workflow [skip ci]"
          git push --force origin starlight-dev
          echo "fork starlight-dev now mirrors upstream starlight-dev + workflow overlay"
